# Docker Compose 部署文件
#
# 使用方法：
#   1. cp .env.example .env
#   2. 编辑 .env，填写 CAMOUFOX_INSTANCE_URL、Cookie 等必要配置
#   3. docker compose up -d --build
#
# 多容器部署建议：
#   docker compose -p ms01 up -d --build
#   docker compose -p ms02 up -d --build
#
# 每个容器应配置不同：
#   - WS_LABEL_PREFIX
#   - NOTIFICATION_INSTANCE_PREFIX
#   - HOST_PORT（若宿主机需要映射端口）
#   - COOKIE_REMOTE_URL / USER_COOKIE_* 等账号来源

services:
  aistudiobuildws:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${IMAGE_NAME:-aistudiobuildws:latest}

    # 不建议设置固定 container_name。
    # 多容器部署时应通过 docker compose -p <项目名> 区分容器。
    restart: unless-stopped

    # 使用 Docker 内置 tini，正确转发 SIGTERM/SIGINT，
    # 并帮助回收 Camoufox/Firefox 产生的子进程。
    init: true

    # 给应用和浏览器优雅退出留出足够时间。
    # 程序会收到 SIGTERM 后停止后台任务、关闭 Context 和 Browser。
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}

    # 项目代码在 Docker 环境中不会自动读取 /app/.env，
    # 因此必须通过 env_file 显式传入配置。
    env_file:
      - .env

    environment:
      # 启用 aiohttp 健康检查服务。
      # 即使 .env 中设置了 HG，也以这里的 true 为准。
      HG: "true"

      # 显式标识 Docker 环境，避免程序尝试自行加载本地 .env。
      DOCKER_ENV: "true"

      # 固定项目根目录，避免不同工作目录导致 cookies/、logs/ 路径异常。
      CAMOUFOX_PROJECT_ROOT: "/app"

    # 默认仅绑定宿主机回环地址，避免健康检查端点直接暴露到公网。
    #
    # 如需对外暴露，可在宿主机环境中设置：
    #   BIND_ADDRESS=0.0.0.0
    #
    # 或通过 Nginx / Caddy / Traefik 反向代理暴露。
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-7860}:7860"

    # Cookie 生命周期管理会自动写入 cookies/<账号>.json；
    # logs/ 中包含应用日志、异常截图和可选 HTML 诊断文件。
    #
    # 不挂载整个项目目录，避免宿主机代码覆盖容器内已构建代码和依赖。
    volumes:
      - ./cookies:/app/cookies
      - ./logs:/app/logs

    # Firefox/Camoufox 可能使用 /dev/shm。
    # 当前项目已关闭 GPU/WebRender 并限制渲染进程，256 MiB 通常足够。
    # 若多账号同时启动时出现浏览器崩溃或共享内存不足，可调整为 512m。
    shm_size: ${SHM_SIZE:-256m}

    # 非 Swarm Docker Compose 下可直接使用以下资源限制字段。
    #
    # 建议初始值：
    #   1 个账号：512m ~ 768m，0.5 ~ 1 CPU
    #   2~4 个账号：1g ~ 2g，1 ~ 2 CPU
    #
    # 可通过宿主机环境变量覆盖，例如：
    #   CONTAINER_CPUS=2.0
    #   CONTAINER_MEMORY_LIMIT=2g
    cpus: "${CONTAINER_CPUS:-1.0}"
    mem_limit: "${CONTAINER_MEMORY_LIMIT:-1g}"
    mem_reservation: "${CONTAINER_MEMORY_RESERVATION:-512m}"

    # 限制进程数，防止异常情况下 Firefox 进程树无限增长。
    # 当前共享 Browser 架构下，256 通常足够。
    pids_limit: "${CONTAINER_PIDS_LIMIT:-256}"

    # Docker stdout/stderr 日志轮转。
    # 注意：这仅控制 docker logs，不控制挂载到 ./logs/app.log 的应用日志文件。
    logging:
      driver: local
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"

    # 健康检查只验证 aiohttp 服务是否可访问。
    #
    # 特别说明：
    # /health 即使返回 waiting_cookie_update、partial 或 degraded，
    # 只要 HTTP 服务正常响应，健康检查仍应通过。
    #
    # 原因：Cookie 全部失效时，项目设计为保持低资源等待并自动恢复；
    # 若把 degraded 视为容器不健康，会造成 Docker 无限重启，
    # 反而破坏 Cookie 生命周期恢复能力。
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health', timeout=5).read()"
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
